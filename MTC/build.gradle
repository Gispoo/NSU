plugins {
    id 'java'
}

group = 'NSU'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation "org.antlr:antlr4-runtime:4.13.2"
}

test {
    useJUnitPlatform()
}